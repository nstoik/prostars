<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prostars</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>

<body>
  <nav class="navbar navbar-expand-md navbar-prostars">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('index') }}">Prostars</a>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('sport_stats', sport='baseball') }}">Baseball</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('sport_stats', sport='hockey') }}">Hockey</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="landing-hero">
    <h1 class="landing-title">Prostars</h1>
    <p class="landing-subtitle">League Stats — Baseball &amp; Hockey</p>

    <div class="sport-cards">
      <a href="{{ url_for('sport_stats', sport='baseball') }}" class="sport-card" data-sport="baseball">
        <span class="sport-card-icon">⚾</span>
        <div class="sport-card-name">Baseball</div>
        <p class="sport-card-desc">Batting &amp; pitching stats for every season</p>
        <span class="sport-card-cta">View Stats</span>
      </a>
      <a href="{{ url_for('sport_stats', sport='hockey') }}" class="sport-card" data-sport="hockey">
        <span class="sport-card-icon">🏒</span>
        <div class="sport-card-name">Hockey</div>
        <p class="sport-card-desc">Skater &amp; goalie stats for every season</p>
        <span class="sport-card-cta">View Stats</span>
      </a>
    </div>

    <p class="landing-about">Stats powered by Prostars League data</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
