<!DOCTYPE html>
<html lang="en" data-bs-theme="dark" data-sport="{{ sport }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prostars — {{ sport | capitalize }} Stats</title>

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Tabulator -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@6/dist/css/tabulator_bootstrap5.min.css">

  <!-- Prostars theme -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>

<body data-sport="{{ sport }}">

  <!-- Navbar -->
  <nav class="navbar navbar-expand-md navbar-prostars">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('index') }}">Prostars</a>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link {% if sport == 'baseball' %}active{% endif %}"
               href="{{ url_for('sport_stats', sport='baseball') }}">Baseball</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if sport == 'hockey' %}active{% endif %}"
               href="{{ url_for('sport_stats', sport='hockey') }}">Hockey</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <!-- Bootstrap 5 JS bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Tabulator -->
  <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6/dist/js/tabulator.min.js"></script>

  <!-- Vue 3 (full build — includes template compiler for in-DOM templates) -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

  <!-- Stats app (loaded after libraries) -->
  <script src="{{ url_for('static', filename='js/stats-app.js') }}"></script>

</body>
</html>
